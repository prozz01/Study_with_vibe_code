<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기계공학 핵심 노트 · 유체역학</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>기계공학 핵심 노트</h1>
      <p>01 · 유체역학<br>검색 · 편집 · 학습완료 · 퀴즈</p>
    </div>
    <input id="search" class="search" placeholder="개념 검색 (Ctrl / ⌘ + K)">
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-footer">
      <button class="small-btn" id="exportBtn">수정 내용 백업(JSON)</button>
      <button class="small-btn" id="importBtn">백업 불러오기</button>
      <button class="small-btn" id="resetBtn">기본 내용으로 초기화</button>
      <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="chapter">유체역학</span>
        <span class="status" id="saveStatus">자동 저장 준비</span>
      </div>
      <div class="actions">
        <button class="action" id="editBtn">편집 모드</button>
        <button class="action primary" id="quizBtn">퀴즈 풀기</button>
      </div>
    </header>

    <div class="content">
      <section class="hero">
        <div class="kicker">Fluid Mechanics</div>
        <h2>공식보다 먼저, “왜 필요한가”를 이해한다.</h2>
        <p>유체가 어디로 얼마나 흐르는지, 압력과 속도가 어떻게 바뀌는지, 그리고 유체와 물체가 서로 어떤 힘을 주고받는지를
        질량·운동량·에너지 보존이라는 세 축으로 정리한 개인용 학습 웹앱입니다.</p>
        <div class="progress-wrap">
          <div class="progress-row"><span>학습 진행률</span><span id="progressText">0 / 0</span></div>
          <div class="progress"><div id="progressBar"></div></div>
        </div>
      </section>
      <div id="sections"></div>
    </div>
  </main>
</div>

<div class="quiz-panel" id="quizPanel">
  <div class="quiz-box">
    <div class="quiz-top">
      <h3>유체역학 핵심 퀴즈</h3>
      <button class="action" id="closeQuiz">닫기</button>
    </div>
    <div class="status" id="quizProgress"></div>
    <div class="quiz-q" id="quizQuestion"></div>
    <div class="options" id="quizOptions"></div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="quiz-bottom">
      <span class="status" id="quizScore"></span>
      <button class="action primary" id="nextQuiz">다음 문제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
